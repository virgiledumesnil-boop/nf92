<script>
    // Attend que la page soit totalement chargée
    document.addEventListener('DOMContentLoaded', () => {
        // Sélectionne tous les liens avec la classe menu-link
        const liens = document.querySelectorAll('.menu-link');

        liens.forEach(lien => {
            lien.addEventListener('click', function() {
                // 1. On retire la classe 'active' de TOUS les liens
                liens.forEach(l => l.classList.remove('active'));
                
                // 2. On ajoute la classe 'active' uniquement à ce lien (this)
                this.classList.add('active');
            });
        });
    });
</script>
